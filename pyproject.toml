[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-walkthrough-analysis"
version = "0.1.0"
description = "Approximate architectural floor-plan reconstruction and walkthrough rendering pipeline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "Pillow>=12.3,<13",
  "Shapely>=2.0,<3",
  "PyYAML>=6,<7",
  "trimesh>=4.4,<5",
  "python-multipart>=0.0.9,<1",
  "google-genai>=1.75,<2",
  "httpx>=0.28,<1",
  "pyasn1>=0.6.4,<1",
  "python-dotenv>=1,<2",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
ai = ["torch>=2.3"]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "mypy>=1.10,<2",
  "ruff==0.15.20",
  "types-PyYAML>=6,<7",
]

[project.scripts]
architecture-walkthrough = "architecture_walkthrough.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires external tools such as Blender or FFmpeg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["src/architecture_walkthrough/scene/blender_templates/"]
