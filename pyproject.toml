[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-walkthrough-analysis"
version = "0.1.0"
description = "Approximate architectural floor-plan reconstruction and walkthrough rendering pipeline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "Pillow>=10,<12",
  "Shapely>=2.0,<3",
  "PyYAML>=6,<7",
  "trimesh>=4.4,<5",
  "python-multipart>=0.0.9,<1",
  "openai>=2.0,<3",
]

[project.optional-dependencies]
ai = ["torch>=2.3"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "mypy>=1.10,<2", "ruff>=0.5,<1"]

[project.scripts]
architecture-walkthrough = "architecture_walkthrough.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires external tools such as Blender or FFmpeg"]

[tool.ruff]
line-length = 100
target-version = "py311"
