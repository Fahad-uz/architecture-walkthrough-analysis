paths:
  work_root: outputs
  blender_executable: blender
  ffmpeg_executable: ffmpeg
limits:
  max_upload_mb: 20
  max_image_width: 6000
  max_image_height: 6000
  processing_timeout_seconds: 120
  subprocess_timeout_seconds: 600
  max_concurrent_analyses: 1
  max_concurrent_generations: 1
  max_frames: 900
  preview_resolution:
    width: 960
    height: 540
  final_resolution:
    width: 1920
    height: 1080
defaults:
  wall_height_m: 3.0
  external_wall_thickness_m: 0.20
  internal_wall_thickness_m: 0.12
  auto_plan_long_side_m: 12.0
  door_width_m: 0.90
  door_height_m: 2.10
  window_width_m: 1.20
  window_height_m: 1.20
  sill_height_m: 0.90
  camera_height_m: 1.65
  floor_thickness_m: 0.10
  ceiling_thickness_m: 0.08
  bevel_width_m: 0.008
ai:
  segmentation_checkpoint: null
  device: cpu
  gemini_enabled: true
  gemini_model: gemini-2.5-flash
  gemini_min_confidence: 0.55
roi_detection:
  enabled: true
  padding_ratio: 0.02
  min_confidence: 0.35
preprocessing:
  max_side_px: 1800
  adaptive_block_ratio: 0.018
  dark_threshold: 170
  min_symbol_area_ratio: 0.000002
  max_text_component_area_ratio: 0.0007
wall_bands:
  min_length_ratio: 0.02
  merge_gap_ratio: 0.012
  coordinate_tolerance_ratio: 0.006
  min_thickness_px: 3
  max_thickness_ratio: 0.04
ocr:
  backend: auto
  enabled: true
  min_confidence: 0.35
scale_solver:
  min_pixels_per_metre: 10.0
  max_pixels_per_metre: 1000.0
  outlier_mad_factor: 2.8
  min_confidence: 0.35
snapping:
  angle_tolerance_deg: 7.0
  gap_tolerance_thickness_factor: 2.5
  merge_overlap_tolerance_factor: 1.5
  min_wall_length_m: 0.20
opening_detection:
  enabled: true
  projection_tolerance_m: 0.35
  default_door_width_m: 0.90
  default_window_width_m: 1.20
overlay:
  enabled: true
  severe_error_blocks_glb: true
reconstruction_quality:
  min_glb_quality_score: 0.45
  allow_debug_fallback_rectangle: false
render:
  preview_samples: 16
  final_samples: 96
  preview_fps: 24
  camera_speed_mps: 1.0
textures:
  registry_path: assets/textures/material_registry.yaml
  default_resolution: 2048
  allow_4k: false
  embed_in_glb: true
  max_texture_size: 4096
optimize:
  enabled: true
  texture_size: 2048
  target_max_mb: 25
assets:
  registry_path: assets/models/asset_registry.yaml
  allow_placeholder_fallback: true
export:
  include_cameras: false
  include_lights: false
  apply_modifiers: true
  export_normals: true
  export_tangents: true
  validation_enabled: true
quality:
  preset: high
  generate_ceilings: true
  generate_trims: true
  generate_doors: true
  generate_windows: true
